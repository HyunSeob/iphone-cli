name: settings-version
description: 설정에서 iOS 버전 읽기
app: com.apple.Preferences
args: {}
steps:
  # restart: 설정은 마지막으로 보던 화면을 기억하므로, 껐다 켜서 첫 화면에서 시작한다
  - launch: {app: com.apple.Preferences, restart: true}
  # '일반'은 폰에 따라 첫 화면 아래쪽에 있어 스크롤해야 보인다
  - scroll_until: {label: "일반"}
  - tap: {label: "일반"}
  - tap: {label: "정보"}
  # 행의 이름표가 "iOS 버전, 27.0.1"처럼 붙어 있다. take: value는 쉼표 뒤를 읽는다
  - read_field: {name: ios_version, selector: {label: "iOS 버전"}, take: value}
output: [ios_version]
