name: calculator-multiply
description: 계산기로 12×34를 계산해 결과 읽기
app: com.apple.calculator
args: {}
steps:
  - launch: com.apple.calculator
  - wait_for: {label: "등호"}
  # 목록으로 주면 화면을 다시 읽지 않고 이어서 누른다 (키패드처럼 누르는 동안 움직이지 않는 화면용).
  # 지우기 키는 입력 중이면 '지우기', 아니면 '모두 지우기'라서 둘 다 받고, 두 번 눌러 남은 계산까지 비운다.
  - tap:
      - {label_regex: "^(모두 )?지우기$"}
      - {label_regex: "^(모두 )?지우기$"}
      - "1"
      - "2"
      - "곱하기"
      - "3"
      - "4"
      - "등호"
  # 계산기 표시 창은 이름표가 없고 식별자에 값이 들어 있다: StandardInputView;value:408
  - read_field: {name: result, selector: {id_regex: "^StandardInputView"}, take: identifier, regex: "value:(.*)$"}
output: [result]
